<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" width="560" height="130">
  <defs>
    <!-- Gradient pour l'icône -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B6CF7"/>
      <stop offset="100%" stop-color="#00E8CC"/>
    </linearGradient>
    <!-- Gradient horizontal pour le texte -->
    <linearGradient id="textGrad" x1="130" y1="0" x2="540" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B6CF7"/>
      <stop offset="55%" stop-color="#5BA4F5"/>
      <stop offset="100%" stop-color="#00E8CC"/>
    </linearGradient>
    <!-- Gradient sous-texte -->
    <linearGradient id="subGrad" x1="130" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B6CF7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00E8CC" stop-opacity="0.7"/>
    </linearGradient>
    <!-- Glow filtre pour l'icône -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Shadow filtre -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7c6af7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ═══ FOND PREVIEW SOMBRE ═══ -->
  <rect width="560" height="130" rx="18" fill="#07060F"/>

  <!-- ═══ ICÔNE — Rounded square avec gradient ═══ -->
  <g filter="url(#shadow)">
    <rect x="15" y="15" width="100" height="100" rx="26" fill="url(#iconGrad)"/>
  </g>
  <!-- Subtle inner border -->
  <rect x="17" y="17" width="96" height="96" rx="24" fill="none"
        stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- ═══ LETTRE F — design géométrique ═══ -->
  <!-- Barre verticale -->
  <rect x="36" y="28" width="13" height="64" rx="6.5" fill="white"/>
  <!-- Barre horizontale haute -->
  <rect x="36" y="28" width="46" height="13" rx="6.5" fill="white"/>
  <!-- Barre horizontale milieu (plus courte) -->
  <rect x="36" y="53" width="34" height="11" rx="5.5" fill="white"/>

  <!-- ═══ ÉTOILE / SPARKLE (accent fidélité) ═══ -->
  <!-- Sparkle 4 branches centré en (84, 32) -->
  <path d="M84,23 L86.2,29.8 L93,32 L86.2,34.2 L84,41 L81.8,34.2 L75,32 L81.8,29.8 Z"
        fill="rgba(255,255,255,0.90)" filter="url(#glow)"/>

  <!-- ═══ POINTS DE FIDÉLITÉ (3 dots en bas à droite) ═══ -->
  <circle cx="84" cy="86" r="5.5" fill="rgba(255,255,255,0.85)"/>
  <circle cx="72" cy="86" r="5.5" fill="rgba(255,255,255,0.50)"/>
  <circle cx="60" cy="86" r="5.5" fill="rgba(255,255,255,0.22)"/>

  <!-- ═══ WORDMARK ═══ -->
  <!-- fidelivo — bold, gradient, letterspacing serré -->
  <text x="133" y="84"
        font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="62" font-weight="800"
        fill="url(#textGrad)"
        letter-spacing="-2.5">fidelivo</text>

  <!-- ═══ TAGLINE sous le nom ═══ -->
  <text x="135" y="104"
        font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="13.5" font-weight="500"
        fill="url(#subGrad)"
        letter-spacing="3.5">LOYALTY PLATFORM</text>
</svg>
